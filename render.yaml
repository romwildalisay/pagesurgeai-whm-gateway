services:
  - type: web
    name: pagesurgeai-whm-gateway
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: WHM_BASE_URL
        sync: false
      - key: WHM_USERNAME
        sync: false
      - key: WHM_API_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://pagesurgeai-whm-gateway.onrender.com
      - key: OAUTH_ISSUER
        sync: false
      - key: OAUTH_AUDIENCE
        value: https://pagesurgeai-whm-gateway.onrender.com/mcp
      - key: OAUTH_SCOPE
        value: whm:read
      - key: WHM_TIMEOUT_MS
        value: 15000
